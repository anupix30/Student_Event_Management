<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Campus Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --netflix-red: #e50914;
            --netflix-red-glow: rgba(229, 9, 20, 0.6);
            --bg-dark: #000000;
            --panel-dark: #0a0a0a;
            --sidebar-collapsed: 80px;
            --sidebar-expanded: 260px;
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body { 
            background: var(--bg-dark); 
            color: white; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-collapsed);
            background: rgba(0, 0, 0, 0.95);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            border-right: 1px solid var(--glass-border);
            z-index: 1000;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            overflow: hidden;
        }

        .sidebar:hover {
            width: var(--sidebar-expanded);
            background: rgba(10, 10, 10, 0.98);
        }

        .brand {
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            color: var(--netflix-red);
            font-family: 'Syncopate', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .menu-list { flex-grow: 1; }

        .menu-item {
            padding: 15px 25px;
            margin-bottom: 10px;
            color: #666;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: 0.3s;
            position: relative;
            white-space: nowrap;
        }

        .menu-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 15%;
            height: 70%;
            width: 4px;
            background: var(--netflix-red);
            box-shadow: 0 0 15px var(--netflix-red);
        }

        .menu-item:hover, .menu-item.active {
            color: white;
            background: linear-gradient(90deg, rgba(229, 9, 20, 0.1) 0%, transparent 100%);
        }

        .icon-box {
            min-width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            transition: 0.3s;
        }

        .gradient-cyan { background: linear-gradient(135deg, #00f2ff, #a336ff); color: white; }
        .gradient-purple { background: linear-gradient(135deg, #ff3e4e, #a336ff); color: white; }
        .gradient-orange { background: linear-gradient(135deg, #ff9f0a, #ff3e4e); color: white; }

        .menu-text {
            opacity: 0;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            transform: translateX(-10px);
            transition: 0.3s;
        }

        .sidebar:hover .menu-text { opacity: 1; transform: translateX(0); }

        .main-content {
            margin-left: var(--sidebar-collapsed);
            padding: 60px;
            width: 100%;
            box-sizing: border-box;
            transition: var(--transition);
        }

        .hero-title { 
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem); 
            font-weight: 900; 
            margin: 0;
            text-transform: uppercase; 
        }

        .hero-title span { 
            color: var(--netflix-red); 
            text-shadow: 0 0 30px var(--netflix-red-glow); 
        }

        .sub-header-text {
            color: #555;
            font-size: 0.8rem;
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .sub-header-text::before {
            content: '';
            width: 30px;
            height: 2px;
            background: var(--netflix-red);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            margin-bottom: 60px;
        }

        .stat-card {
            background: #0a0a0a;
            padding: 40px;
            border: 1px solid #1a1a1a;
            transition: 0.5s;
        }

        .stat-card:hover { border-color: var(--netflix-red); background: #000; transform: translateY(-5px); }
        .stat-val { font-size: 3rem; font-weight: 900; color: #fff; display: block; }
        .stat-label { color: #555; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 2px; font-weight: 700; }

        .card { 
            background: #0a0a0a; 
            border: 1px solid #1a1a1a; 
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }
        th { 
            text-align: left; 
            color: #444; 
            padding: 20px 25px; 
            text-transform: uppercase; 
            font-size: 0.65rem; 
            letter-spacing: 2px;
            border-bottom: 1px solid #111;
        }

        td { padding: 25px; border-bottom: 1px solid #111; font-size: 0.9rem; vertical-align: middle; }

        .btn {
            padding: 8px 16px;
            border: 1px solid white;
            background: transparent;
            color: white;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-approve { border-color: #10b981; color: #10b981; margin-right: 8px; }
        .btn-approve:hover { background: #10b981; color: black; }

        .btn-reject { border-color: var(--netflix-red); color: var(--netflix-red); }
        .btn-reject:hover { background: var(--netflix-red); color: black; }

        .status-pill {
            font-family: 'Syncopate', sans-serif;
            padding: 6px 12px;
            font-size: 0.55rem;
            letter-spacing: 1px;
            border: 1px solid currentColor;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand"><span class="brand-text">HUB</span></div>
        <nav class="menu-list">
            <div class="menu-item active" onclick="switchTab('dashboard', this)">
                <div class="icon-box gradient-cyan"><i data-lucide="layout-dashboard" size="18"></i></div>
                <span class="menu-text">Dashboard</span>
            </div>
            <div class="menu-item" onclick="switchTab('approve', this)">
                <div class="icon-box gradient-purple"><i data-lucide="check-circle" size="18"></i></div>
                <span class="menu-text">Approved</span>
            </div>
            <div class="menu-item" onclick="switchTab('pending', this)">
                <div class="icon-box gradient-orange"><i data-lucide="clock" size="18"></i></div>
                <span class="menu-text">Pending</span>
            </div>
            <div class="menu-item" onclick="switchTab('reject', this)">
                <div class="icon-box" style="color: #666;"><i data-lucide="history" size="18"></i></div>
                <span class="menu-text">History</span>
            </div>
        </nav>
    </aside>

    <main class="main-content">
        <header>
            <h1 class="hero-title" id="viewTitle">ADMIN<br><span>DASHBOARD</span></h1>
            <div class="sub-header-text" id="subTitle">Overview of campus engagement and metrics</div>
        </header>

        <div id="dashboardSection">
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-val" id="totalEventsCount">0</span>
                    <span class="stat-label">Total Experiences</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val" id="totalStudentsCount" style="color: var(--netflix-red);">0</span>
                    <span class="stat-label">Registered Members</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val" id="pendingReviewsCount">0</span>
                    <span class="stat-label">Awaiting Review</span>
                </div>
            </div>
        </div>

        <div id="tableSection" class="hidden">
            <div class="card">
                <table id="eventTable">
                    <thead>
                        <tr>
                            <th>Experience Name</th>
                            <th>Organization</th>
                            <th>Schedule</th>
                            <th>Description</th>
                            <th style="text-align:right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        const socket = new WebSocket('wss://mahehub-backend.onrender.com');
        let allEvents = [];
        let currentTab = 'dashboard';

        socket.onopen = () => socket.send(JSON.stringify({ type: 'REGISTER', role: 'admin' }));

        socket.onmessage = (msg) => {
            const data = JSON.parse(msg.data);
            if (data.type === 'SYNC_DATA') {
                allEvents = data.payload;
                renderView();
            }
        };

        function switchTab(tab, el) {
            currentTab = tab;
            document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            
            const titleElement = document.getElementById('viewTitle');
            if (tab === 'dashboard') {
                titleElement.innerHTML = 'ADMIN<br><span>DASHBOARD</span>';
                document.getElementById('dashboardSection').classList.remove('hidden');
                document.getElementById('tableSection').classList.add('hidden');
            } else {
                titleElement.innerHTML = `${tab.toUpperCase()}<br><span>EVENTS</span>`;
                document.getElementById('dashboardSection').classList.add('hidden');
                document.getElementById('tableSection').classList.remove('hidden');
            }
            renderView();
        }

        function renderView() {
            document.getElementById('totalEventsCount').innerText = allEvents.length;
            document.getElementById('pendingReviewsCount').innerText = allEvents.filter(e => e.status === 'pending').length;
            
            // Fixed registration count summation
            const studentTotal = allEvents.reduce((acc, ev) => acc + (ev.reg_count || 0), 0);
            document.getElementById('totalStudentsCount').innerText = studentTotal;

            if (currentTab !== 'dashboard') {
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = "";
                const filtered = allEvents.filter(ev => {
                    if (currentTab === 'reject') return ev.status === 'reject';
                    if (currentTab === 'approve') return ev.status === 'approve';
                    return ev.status === currentTab;
                });
                
                filtered.forEach(ev => {
                    const row = tbody.insertRow();
                    const safe = JSON.stringify(ev).replace(/"/g, '&quot;');
                    
                    let actions = currentTab === 'pending' ? 
                        `<div style="text-align:right">
                            <button class="btn btn-approve" onclick="decide('${ev.id}','${ev.name}','approve',${safe})">Approve</button>
                            <button class="btn btn-reject" onclick="decide('${ev.id}','${ev.name}','reject',${safe})">Reject</button>
                        </div>` :
                        `<div style="text-align:right">
                            <span class="status-pill" style="color:${ev.status==='approve'?'#10b981':'#e50914'}">
                                ${ev.status.toUpperCase()}
                            </span>
                        </div>`;
                    
                    row.innerHTML = `
                        <td>
                            <div style="font-weight:900; color:white; text-transform:uppercase; letter-spacing:1px;">${ev.name}</div>
                            <div style="color:var(--netflix-red); font-size: 0.7rem; font-weight: 700; margin-top: 4px;">
                                ${ev.reg_count || 0} REGISTERED
                            </div>
                        </td>
                        <td style="color:#555; font-weight:700;">${ev.club ? ev.club.toUpperCase() : 'UNKNOWN'}</td>
                        <td>
                            <div style="font-size: 0.75rem; color: #aaa;">
                                <span><i data-lucide="calendar" size="12"></i> ${ev.date ? ev.date : 'TBD'}</span><br>
                                <span><i data-lucide="clock" size="12"></i> ${ev.time ? ev.time : 'TBA'}</span>
                            </div>
                        </td>
                        <td style="color:#666; max-width: 250px; overflow: hidden; text-overflow: ellipsis;">${ev.desc}</td>
                        <td>${actions}</td>
                    `;
                });
                lucide.createIcons();
            }
        }

        function decide(id, name, status, payload) {
            socket.send(JSON.stringify({ type: 'EVENT_DECISION', id, name, status, payload }));
        }
    </script>
</body>
</html>
